# Per-PR CI, following TESTING.md: typecheck, lint + format, the fast unit
# and worker suites, and one e2e smoke (sign-in gate + one core write path).
#
# Runs once per PR head. Not on push and not on main after merge: the PR run
# already tested that code. The `check` job must report on every PR,
# docs-only ones included, so there is no workflow-level paths filter (a
# path-skipped workflow never reports). The first step reads the PR's files
# and the rest only runs when something other than docs changed.
#
# Heavy suites (mobile, component system, native owner, legacy native, full
# chat workspace, avatars) live in full-suite.yml and run on demand.
#
# Public repo: GitHub-hosted ubuntu-latest only. Never self-hosted.
name: Client foundation checks

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Docs-only PRs report green here and skip the rest. Workflow files
          # count as code. Any error reading the file list runs everything.
          full() { echo "$1; running the full check."; echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ -n "$PR" ] || full "No PR number"
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') \
            || full "Could not list PR files"
          [ -n "$files" ] || full "Empty PR file list"
          printf 'Changed:\n%s\n' "$files"
          code=$(printf '%s\n' "$files" \
            | grep -v -E '^(docs/|\.github/ISSUE_TEMPLATE/)|\.md$|^LICENSE$' | grep -c . || true)
          [ "$code" = "0" ] || full "$code non-doc file(s) changed"
          echo "Docs-only PR; skipping the rest."
          echo "code=false" >> "$GITHUB_OUTPUT"

      - if: steps.changes.outputs.code == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Unit rollback fixtures read the exact historical Python payload.
      - if: steps.changes.outputs.code == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.changes.outputs.code == 'true'
        run: npm ci --ignore-scripts

      - name: Typecheck
        if: steps.changes.outputs.code == 'true'
        run: npm run typecheck && npm run typecheck:worker
      - name: Lint (prettier --check, then eslint)
        if: steps.changes.outputs.code == 'true'
        run: npm run format:check && npm run lint
      - name: Unit tests
        if: steps.changes.outputs.code == 'true'
        run: npm test
      - name: UI, system and connection contracts
        if: steps.changes.outputs.code == 'true'
        run: npm run check:ui
      - name: Agent guard audit
        if: steps.changes.outputs.code == 'true'
        run: node scripts/audit-agent-guards.mjs
      - name: Plugin unit tests
        if: steps.changes.outputs.code == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/bot-web-test-env"
          "$RUNNER_TEMP/bot-web-test-env/bin/pip" install -q -r test/plugin/requirements.txt
          "$RUNNER_TEMP/bot-web-test-env/bin/python" -m unittest discover -s test/plugin -p 'test_*.py'

      # The smoke and the release UI check only need the web bundle.
      - name: Build web
        if: steps.changes.outputs.code == 'true'
        run: npx vite build --config vite.web.config.ts
      - name: Release UI check
        if: steps.changes.outputs.code == 'true'
        run: node scripts/check-release-ui.mjs

      - name: Playwright version
        id: pw
        if: steps.changes.outputs.code == 'true'
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        if: steps.changes.outputs.code == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.changes.outputs.code == 'true'
        run: npx playwright install chromium

      - name: Owner worker tests
        if: steps.changes.outputs.code == 'true'
        run: npm run test:owner-worker
      - name: E2E smoke (sign-in gate + project/task write)
        if: steps.changes.outputs.code == 'true'
        # drafts.spec: send a message, sign out, land on the Sign in gate.
        # work.spec: create a project board and a task and see both show up.
        run: >-
          npx playwright test --config playwright.chat.config.ts
          test/chat-workspace/drafts.spec.ts test/chat-workspace/work.spec.ts
          -g "signing out clear saved drafts|project boards and tasks work through global creation"
      - if: failure() && steps.changes.outputs.code == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: smoke-failure
          path: test-results/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Dependency audit
        if: steps.changes.outputs.code == 'true'
        run: npm audit --omit=dev --audit-level=high
